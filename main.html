<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Distribution</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #sidebar {
            width: 30%;                 /* starting width */
            min-width: 220px;           /* don’t let it get too small */
            max-width: 65%;             /* optional max size */
            padding: 10px;
            background-color: #f4f4f4;
            overflow-y: auto;
            box-sizing: border-box;
            border-right: none;         /* remove the old fixed border */
        }

        #resizer {
            width: 8px;
            background-color: #bbb;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background-color 0.15s;
        }

        #resizer:hover,
        #resizer.resizing {
            background-color: #666;
        }

        #map {
            flex: 1;
            height: 100%;
            min-width: 300px;
        }
        #resizer:hover,
        #resizer.resizing {
            background-color: #999;
        }
        #controls, #resourceInputs, #hazardControls, #routeOptions, #stats {
            margin-bottom: 15px;
        }
        #routeDisplay {
            width: 100%;
            height: 100px;
        }
        .custom-div-icon {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .resource-input {
        width: 50px; 
        padding: 2px; 
        font-size: 14px; 
        text-align: center; 
        }
        #resourceInputs table td {
            padding: 5px; 
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div id="controls">
                <button id="addDisasterLocationButton">Add Disaster Locations<i class="fas fa-pen"></i></button>
                <button id="loadRoutesButton">Load Routes</button>
                <button id="runButton">Run Algorithm</button>
                <button id="resetButton">Reset</button>
                <label>Team Capacity (per Resource): <input type="number" id="teamCapacity" value="5" min="1"></label>
            </div>
            <div id="resourceInputs">
                <h3>Input Resources for Locations</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Location</th>
                            <th>Water</th>
                            <th>Food</th>
                            <th>MedSupplies</th>
                            <th>ShelterSupplies</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-location="Resource Center 1">
                            <td>Resource Center 1</td>
                            <td><input type="number" class="resource-input" data-resource="Water" value="5"></td>
                            <td><input type="number" class="resource-input" data-resource="Food" value="10"></td>
                            <td><input type="number" class="resource-input" data-resource="MedSupplies" value="10"></td>
                            <td><input type="number" class="resource-input" data-resource="ShelterSupplies" value="5"></td>
                        </tr>                       
                        <tr data-location="Resource Center 2">
                            <td>Resource Center 2</td>
                            <td><input type="number" class="resource-input" data-resource="Water" value="5"></td>
                            <td><input type="number" class="resource-input" data-resource="Food" value="10"></td>
                            <td><input type="number" class="resource-input" data-resource="MedSupplies" value="5"></td>
                            <td><input type="number" class="resource-input" data-resource="ShelterSupplies" value="5"></td>
                        </tr>
                    </tbody>
                </table>
                <button id="updateResources">Update Resources</button>
            </div>
            <div id="hazardControls">
                <h3>Affected Routes</h3>
                <select id="fromLocation"></select>
                <select id="toLocation"></select>
                <select id="routeSelection"></select>
                <input type="number" id="hazardLevel" min="1" max="7" value="1" placeholder="Hazard Level">
                <select id="hazardCategory">
                    <option value="None">None</option>
                    <option value="Fire">Fire</option>
                    <option value="Earthquake">Earthquake</option>
                    <option value="Flood">Flood</option>
                    <option value="Hurricane">Hurricane</option>
                </select>
                <button class="btn btn-blue btn-xs" id="addHazard">Add Hazard</button>
                <ul id="hazardList"></ul>
                <button id="add-hazard-btn">
                     Add Hazard Area <i class="fas fa-pen"></i>
                </button>
            </div>
            <div id="routeOptions">
                <h3>Available Routes</h3>
                <ul id="routeList"></ul>
            </div>
            <div id="stats">
                <p>Total Distance: <span id="totalDistance">0</span> km</p>
                <p>Computation Time: <span id="compTime">0</span> ms</p>
                <p>Resource Status: <span id="resourceStatus"></span></p>
            </div>
            <div>
                <textarea id="routeDisplay" readonly style="width: 100%; height: 100px;"></textarea>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

    <script src="main.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</body>
</html>
